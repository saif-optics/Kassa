<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Отметка — Saif-Optics</title>
<!-- Киоск отметки по лицу. Распознавание — face.js (общий с админкой): модели локально (vendor/, models/), кэш — sw.js.
     Порядок: детектор (SSD на компьютере, Tiny на телефоне) → проверка кадра (размер, центр, свет, резкость) →
     точки лица → дескриптор → сравнение со ВСЕМИ снимками сотрудника (минимум) + отрыв от второго сотрудника;
     решение — NEED кадров подряд. Параллельно — ОДНО короткое задание живости (моргнуть или повернуть голову).
     Защита только от статичного фото: видео с лицом она не остановит. ?debug=1 — цифры на экране для подбора порогов. -->
<meta name="theme-color" content="#0e1319">
<style>
:root{--bg:#0e1319;--card:rgba(28,36,46,.78);--line:rgba(160,185,210,.16);--tx:#eef3f8;--mut:#8b9aab;--acc:#27b3dc;--ok:#2fbf71;--warn:#f0a43a;--bad:#ef6257}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);
 background-image:radial-gradient(1100px 600px at 8% -10%,rgba(39,179,220,.2),transparent),radial-gradient(900px 500px at 110% 110%,rgba(47,191,113,.12),transparent);
 min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;padding:12px}
.glass{background:var(--card);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.wrap{width:min(1000px,100%);display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:760px){.wrap{grid-template-columns:1fr}body{align-items:flex-start}}
.main{padding:28px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:560px;justify-content:center}
@media (max-width:760px){.main{padding:18px;min-height:0}}
.pt{font-size:15px;color:var(--mut);letter-spacing:.02em}.pt b{color:var(--tx)}
.clock{font-size:clamp(64px,12vw,96px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0 4px}
.date{color:var(--mut);margin-bottom:26px;text-transform:capitalize}
button{font:inherit;border:0;cursor:pointer;border-radius:16px;transition:transform .12s,opacity .12s;color:inherit}
button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:default}
.big{background:var(--acc);color:#06222c;font-size:24px;font-weight:700;padding:22px 54px;border-radius:22px;box-shadow:0 10px 30px rgba(39,179,220,.35)}
.sec{background:rgba(140,160,185,.16);color:var(--tx);padding:12px 22px;font-weight:600}
.hint{color:var(--mut);font-size:14px;margin-top:14px}
.ld{width:min(280px,70%);height:5px;border-radius:3px;background:rgba(140,160,185,.2);margin:14px auto 0;overflow:hidden}.ld i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}

/* камера + рамка-овал: цвет по состоянию (ищу — белый, держите — голубой, готово — зелёный, подсказка — коралл) */
.cam{position:relative;width:100%;max-width:560px;aspect-ratio:4/3;border-radius:26px;overflow:hidden;background:#000;--rc:rgba(255,255,255,.75)}
@media (max-width:760px),(max-aspect-ratio:1/1){.cam{aspect-ratio:3/4;max-height:70vh}}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .ring{position:absolute;inset:9% 24%;border:4px solid var(--rc);border-radius:50%;transition:border-color .25s,box-shadow .25s,transform .25s;box-shadow:0 0 0 999px rgba(6,10,14,.38)}
.cam.search .ring{animation:pulse 1.6s ease-in-out infinite}
.cam.hold{--rc:var(--acc)}.cam.hold .ring{box-shadow:0 0 0 999px rgba(6,10,14,.38),0 0 28px rgba(39,179,220,.55)}
.cam.ok{--rc:var(--ok)}.cam.ok .ring{box-shadow:0 0 0 999px rgba(6,10,14,.38),0 0 34px rgba(47,191,113,.7);transform:scale(1.03)}
.cam.warn{--rc:var(--bad)}
@keyframes pulse{50%{transform:scale(1.025);opacity:.8}}
.cam .chal{position:absolute;left:0;right:0;top:0;padding:14px 10px;text-align:center;color:#fff;font-size:clamp(24px,5vw,32px);font-weight:800;background:linear-gradient(rgba(0,0,0,.7),transparent);text-shadow:0 2px 8px rgba(0,0,0,.6);animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.cam .meter{position:absolute;left:18%;right:18%;bottom:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}.cam .meter i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.cam .dbg{position:absolute;left:6px;bottom:24px;font:11px/1.3 monospace;color:#9f9;text-shadow:0 1px 2px #000;white-space:pre}
.status{margin-top:16px;font-size:clamp(20px,4.5vw,26px);font-weight:700;min-height:34px;transition:color .2s}
.status.warn{color:var(--bad)}.status.ok{color:var(--ok)}.status.hold{color:var(--acc)}
.who{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.who img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--ok);animation:pop .3s ease-out}
.who .nm{font-size:clamp(30px,6vw,40px);font-weight:800;line-height:1.1}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.row{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.kind{padding:18px 34px;font-size:22px;font-weight:700;background:rgba(140,160,185,.16);color:var(--tx);position:relative;overflow:hidden}
.kind.on{background:var(--ok);color:#06210f}.kind.on.out{background:var(--warn);color:#2a1a02}
.kind .bar{position:absolute;left:0;bottom:0;height:4px;background:rgba(0,0,0,.35);width:0}
.done{font-size:84px;color:var(--ok);line-height:1;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}.done.out{color:var(--warn)}
.kindbig{font-size:clamp(40px,9vw,60px);font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;line-height:1.05}.kindbig.out{color:var(--warn)}.kindbig.bad{color:var(--bad);font-size:30px}
.side{padding:22px 20px;max-height:560px;overflow:auto}
@media (max-width:760px){.side{max-height:none}}
.side h3{margin:0 0 12px;font-size:17px}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);font-size:16px}
.li:last-child{border:0}.li .t{font-variant-numeric:tabular-nums;color:var(--mut)}.late{color:var(--bad)!important}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--ok)}.dot.out{background:var(--mut)}
input{font:inherit;font-size:28px;text-align:center;letter-spacing:.2em;text-transform:uppercase;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--tx);width:min(260px,80vw)}
.err{color:var(--bad);margin-top:12px;min-height:22px}
.q{position:fixed;left:16px;bottom:14px;font-size:13px;color:var(--warn)}
.gear{position:fixed;right:14px;bottom:10px;background:none;color:var(--mut);font-size:13px;padding:6px 10px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="setup" class="glass main hide" style="width:min(520px,92vw)">
  <div style="font-size:44px">📷</div>
  <h2 style="margin:8px 0 4px">Настройка точки</h2>
  <div class="hint" style="margin:0 0 22px">Введите код точки из админки (раздел «Точки»)</div>
  <input id="code" maxlength="12" autocomplete="off" spellcheck="false">
  <div class="err" id="setupErr"></div>
  <button class="big" id="saveCode" style="margin-top:8px">Сохранить</button>
</div>

<div id="app" class="wrap hide">
  <div class="glass main">
    <div id="idle">
      <div class="pt">Saif-Optics · <b id="ptName"></b></div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <button class="big" id="go" disabled>Загрузка…</button>
      <div class="ld" id="ld"><i></i></div>
      <div class="err hide" id="ldErr" style="max-width:420px;margin:12px auto 0"></div>
      <div class="hint">Нажмите и посмотрите в камеру · или клавиша «пробел»</div>
    </div>
    <div id="scan" class="hide" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="cam search" id="camBox"><video id="video" playsinline muted></video><div class="ring"></div><div class="chal hide" id="chal"></div><div class="meter"><i id="meter"></i></div><div class="dbg hide" id="dbg"></div></div>
      <div class="status" id="status">Смотрите в камеру</div>
      <button class="sec" id="cancelScan" style="margin-top:10px">Отмена</button>
    </div>
    <div id="confirm" class="hide who">
      <img id="snap" alt="">
      <div class="nm" id="whoName"></div>
      <div class="hint" style="margin:0" id="whoHint"></div>
      <div class="row">
        <button class="kind" data-k="in">Пришёл<span class="bar"></span></button>
        <button class="kind out" data-k="out">Ушёл<span class="bar"></span></button>
      </div>
      <button class="sec" id="notMe" style="margin-top:10px">Это не я</button>
    </div>
    <div id="result" class="hide who">
      <div class="done" id="doneIcon">✓</div>
      <div class="nm" id="doneName"></div>
      <div class="kindbig" id="doneTitle"></div>
      <div class="hint" style="font-size:18px;margin:0" id="doneSub"></div>
    </div>
  </div>
  <div class="glass side">
    <h3>Сегодня на точке</h3>
    <div id="today"><div class="hint">Пока никто не отметился</div></div>
  </div>
</div>
<div class="q hide" id="queue"></div>
<button class="gear hide" id="reset">Сменить точку</button>

<script type="module">
import * as F from "./face.js";
const SB = "https://qvblxhyftwivkzxucfak.supabase.co";
const KEY = "sb_publishable_-ceoJkpmAZ7Y8osbPHaOlg_3nqUsdB7";
const TZ = "Asia/Tashkent";
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
const LIVE_MS = 5000;       // время на одно задание живости (не прошёл — новое задание, без паузы)
const FIND_MS = 25000;      // сколько ищем лицо, потом возвращаемся на главный экран
const CONFIRM_MS = 1500;    // пауза перед автоматической отметкой (можно сменить «Пришёл/Ушёл» или «Это не я»)
const AGAIN_MS = 90000;     // повторная отметка того же человека раньше — не пишется
// Время отметки при отправке из очереди: att_kiosk_mark принимает p_at (миграция 20261128_14_att_mark_at.sql):
// не старше суток и не из будущего, повтор той же отметки ±3 мин от этого времени сервер не пишет.
const SUPPORTS_P_AT = true;
const SLOW_MS = 8000;       // после стольких мс показываем «Связь медленная, ждём…»
const WAIT_MS = 40000;      // дольше ответ записи не ждём (дальше — очередь с проверкой журнала)
const $ = id => document.getElementById(id);
const show = (id, on = true) => $(id).classList.toggle("hide", !on);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const raf = () => new Promise(r => requestAnimationFrame(r));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let code = new URLSearchParams(location.search).get("code") || localStorage.getItem("att_code") || "";
let data = null, fa = null, ready = false, stream = null, busy = false, warmP = null;

// service worker: кэш весов и работа без интернета
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
navigator.storage?.persist?.().catch(() => {});

async function rpc(fn, args, timeout = 0) {
  const ac = timeout ? new AbortController() : null, to = timeout && setTimeout(() => ac.abort(), timeout);
  try {
    const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, { method: "POST", signal: ac?.signal,
      headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, "Content-Type": "application/json" }, body: JSON.stringify(args) });
    const j = await r.json().catch(() => null);
    if (!r.ok) { const e = new Error(j?.message || r.statusText); e.server = true; throw e; }
    return j;
  } finally { clearTimeout(to); }
}
const hm = d => new Intl.DateTimeFormat("ru-RU", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }).format(new Date(d));
const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const lateMin = ts => { const n = mins(hm(ts)) - mins(data.start_time); return n > 0 ? n : 0; };
const jget = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

// ---------- часы ----------
function tick() {
  const n = new Date();
  $("clock").textContent = hm(n);
  $("date").textContent = new Intl.DateTimeFormat("ru-RU", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" }).format(n);
}
setInterval(tick, 1000); tick();

// ---------- звук и вибрация ----------
let actx = null;
function beep(kind) {
  try {
    actx ??= new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.();
    const seq = kind === "ok" ? [[660, 0, .09], [880, .1, .14]] : kind === "bad" ? [[220, 0, .25]] : [[520, 0, .06]];
    for (const [f, at, len] of seq) {
      const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(.0001, actx.currentTime + at); g.gain.exponentialRampToValueAtTime(.25, actx.currentTime + at + .01);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + at + len);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + at); o.stop(actx.currentTime + at + len + .02);
    }
  } catch {}
}
const buzz = p => { try { navigator.vibrate?.(p); } catch {} };

// ---------- геолокация: заранее, отметку не задерживает ----------
let geoLast = null;
function geoWarm() {
  navigator.geolocation?.getCurrentPosition(p => { geoLast = { c: p.coords, t: Date.now() }; }, () => {}, { timeout: 8000, maximumAge: 600000 });
}

// ---------- настройка ----------
function openApp() {
  show("setup", false); show("app"); show("reset");
  $("ptName").textContent = data.point; renderToday(); geoWarm();
  setInterval(refresh, 5 * 60 * 1000);
}
async function start() {
  if (!code) { show("setup"); $("code").focus(); return; }
  const cached = code === localStorage.getItem("att_code") ? jget("att_cache", null) : null;
  const fresh = async () => { data = await rpc("att_kiosk_load", { p_code: code }, 8000); localStorage.setItem("att_code", code); localStorage.setItem("att_cache", JSON.stringify(data)); };
  if (cached) {
    // из кэша — сразу; свежие данные подтянутся в фоне (сотрудники, переснятые лица)
    data = cached; openApp();
    fresh().then(() => { $("ptName").textContent = data.point; renderToday(); })
      .catch(e => { if (e.server) { localStorage.removeItem("att_code"); localStorage.removeItem("att_cache"); location.reload(); } });
    return;
  }
  try { await fresh(); }
  catch (e) {
    if (e.server) { localStorage.removeItem("att_code"); code = ""; show("setup"); $("setupErr").textContent = "Неверный код точки"; return; }
    show("setup"); $("setupErr").textContent = "Нет интернета"; return;
  }
  if (location.search.includes("code=")) history.replaceState(null, "", location.pathname);
  openApp();
}
$("saveCode").onclick = () => { code = $("code").value.trim().toUpperCase(); $("setupErr").textContent = ""; start(); };
$("code").onkeydown = e => { if (e.key === "Enter") $("saveCode").click(); };
$("reset").onclick = () => { if (confirm("Сменить точку на этом устройстве?")) { localStorage.removeItem("att_code"); localStorage.removeItem("att_cache"); location.reload(); } };

async function refresh() {
  try { data = await rpc("att_kiosk_load", { p_code: code }, 8000); localStorage.setItem("att_cache", JSON.stringify(data)); renderToday(); } catch {}
  flushQueue();
}

function renderToday() {
  const names = Object.fromEntries(data.employees.map(e => [e.id, e.name]));
  const by = {};
  for (const ev of data.today) {
    if (!names[ev.e] || (ev.p && ev.p !== data.point)) continue; // в списке — только отметки этой точки
    const r = by[ev.e] ??= { name: names[ev.e], first: null, last: null };
    if (ev.k === "in" && !r.first) r.first = ev.t;
    r.last = ev;
  }
  const rows = Object.values(by).sort((a, b) => (a.first || "z").localeCompare(b.first || "z"));
  $("today").innerHTML = rows.length ? rows.map(r => {
    const out = r.last.k === "out";
    const late = r.first && lateMin(r.first) > 0;
    return `<div class="li"><span><span class="dot ${out ? "out" : ""}"></span>${esc(r.name)}</span>
      <span class="t ${late ? "late" : ""}">${r.first ? hm(r.first) : "—"}${out ? " – " + hm(r.last.t) : ""}</span></div>`;
  }).join("") : `<div class="hint">Пока никто не отметился</div>`;
}

// ---------- модели: грузим сразу при открытии страницы, параллельно с данными точки ----------
async function loadModels() {
  const t0 = performance.now();
  try {
    fa = await F.loadFace(p => { $("go").textContent = `Загрузка ${Math.round(p * 100)}%`; $("ld").firstChild.style.width = p * 100 + "%"; });
    const tLoad = Math.round(performance.now() - t0);
    $("go").textContent = "Подготовка…";
    warmP = F.warmup(fa); const tw = await warmP;
    window.__kiosk = { det: F.DET, load_ms: tLoad, warm_ms: tw };
    if (DEBUG) console.log("модели", window.__kiosk);
    ready = true; $("go").disabled = false; $("go").textContent = "Отметиться"; show("ld", false);
  } catch (e) {
    console.error(e); $("go").textContent = "Повторить"; $("go").disabled = false; show("ld", false);
    $("ldErr").textContent = F.explain(e); show("ldErr");
  }
}

function status(text, cls = "") { const s = $("status"); s.textContent = text; s.className = "status " + cls; }
function state(cls) { $("camBox").className = "cam " + cls; }
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 100;

// ---------- распознавание ----------
async function scan() {
  if (!ready || busy) return;
  busy = true; beep("tap");
  show("idle", false); show("scan"); state("search"); status("Смотрите в камеру"); $("meter").style.width = "0";
  $("chal").classList.add("hide"); $("dbg").classList.toggle("hide", !DEBUG);
  geoWarm();
  const tStart = performance.now();
  const v = $("video");
  try {
    // камера включается параллельно с прогревом (если он ещё не закончился)
    [stream] = await Promise.all([navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user", frameRate: { ideal: 30 } }, audio: false }), warmP]);
    v.srcObject = stream; await v.play();
  } catch (e) {
    console.error(e); stopCam();
    status(F.explain(e), "warn"); beep("bad");
    setTimeout(home, 6000); return; // home() сбрасывает busy
  }
  const my = stream, fc = document.createElement("canvas"), fg = fc.getContext("2d");
  const cyc = [], need = F.CFG.NEED, t0 = Date.now();
  let streak = 0, lastId = null, live = null, liveT = 0, miss = 0, bad = 0, frames = 0, slow = 0, noFace = 0, lastStart = 0, tFace = 0;
  const reset = () => { streak = 0; lastId = null; live = null; miss = 0; bad = 0; $("chal").classList.add("hide"); $("meter").style.width = "0"; };
  while (stream === my) {
    const wait = F.CFG.FRAME_MS - (performance.now() - lastStart); // не чаще одного цикла за FRAME_MS, циклы не накладываются
    if (wait > 0) await sleep(wait);
    await raf(); if (stream !== my) return;
    lastStart = performance.now();
    if (Date.now() - t0 > FIND_MS) { status("Не удалось узнать. Попробуйте ещё раз", "warn"); beep("bad"); stopCam(); setTimeout(home, 2500); return; }
    if (!v.videoWidth) continue;
    if (fc.width !== v.videoWidth) { fc.width = v.videoWidth; fc.height = v.videoHeight; }
    fg.drawImage(v, 0, 0);
    try {
      const td = performance.now();
      const det = await F.detect(fa, fc);
      const dMs = performance.now() - td;
      // слабый компьютер: SSD дольше ~300 мс на кадр — переходим на лёгкий детектор
      frames++; if (F.DET === "ssd" && frames > 1 && frames <= 7 && dMs > 300 && ++slow >= 3) F.useTiny();
      if (stream !== my) return;
      if (!det) { if (++noFace >= 2) { reset(); state("search"); status("Смотрите в камеру"); } continue; }
      noFace = 0; tFace ||= performance.now();
      const q = F.quality(det.box, fc.width, fc.height, F.facePixels(fc, det.box));
      if (!q.ok) { reset(); state("warn"); status(q.hint, "warn"); dbg(q, dMs, 0, null); continue; }
      const lm = await F.landmarks(fa, fc, det);
      if (stream !== my || !lm) continue;
      const p = lm.landmarks.positions;
      // дескриптор (самая тяжёлая сеть) — только на лице, обращённом в камеру: пока узнаём — каждый кадр, потом каждый 3-й
      const frontal = Math.abs(F.turnOffset(p)) < 0.15;
      let m = null;
      if (frontal && (streak < need || frames % 3 === 0)) {
        const desc = await F.describeFace(fa, fc, lm); if (stream !== my) return;
        if (streak < need) {
          m = F.match(data.employees, desc);
          if (F.sure(m)) { if (m.id !== lastId) live = null; streak = m.id === lastId ? streak + 1 : 1; lastId = m.id; miss = 0; }
          else if (streak && ++miss >= 2) reset(); // один сомнительный кадр не сбрасывает прогресс
        } else if (F.isSame(data.employees, lastId, desc, F.CFG.MATCH + 0.05)) bad = 0;
        else if (++bad >= 2) { reset(); state("search"); continue; }
      }
      if (streak >= 1) {
        // ровно одно задание живости; запускается сразу после первого уверенного кадра, пока набираются остальные
        if (!live) { live = F.pickLive(avg(cyc)); liveT = Date.now(); $("chal").textContent = live.text; $("chal").classList.remove("hide"); beep("tap"); }
        live.feed(p);
        state(live.done && streak >= need ? "ok" : "hold");
        status(live.done ? "Узнаю…" : live.text, "hold");
        $("meter").style.width = Math.round(((Math.min(streak, need) / need) * 0.5 + (live.done ? 0.5 : 0)) * 100) + "%";
        if (live.done && streak >= need) {
          const id = lastId, score = 1 - (m?.d ?? F.CFG.MATCH), photo = grab(fc);
          if (DEBUG) console.log("от лица до решения, мс:", Math.round(performance.now() - tFace), "от нажатия:", Math.round(performance.now() - tStart));
          stopCam(); beep("ok"); buzz(70); return ask(id, score, photo);
        }
        if (Date.now() - liveT > LIVE_MS) { live = null; $("chal").classList.add("hide"); status("Не получилось — попробуем ещё раз", "warn"); }
      } else { state("search"); status(data.employees.length ? "Смотрите прямо в камеру" : "Сотрудники ещё не добавлены"); }
      dbg(q, dMs, performance.now() - lastStart, m); cyc.push(performance.now() - lastStart); if (cyc.length > 8) cyc.shift();
    } catch (e) { console.error(e); await sleep(300); }
  }
}
function dbg(q, dMs, cMs, m) {
  if (!DEBUG) return;
  $("dbg").textContent = `${F.DET} detect ${dMs | 0}мс · цикл ${cMs | 0}мс\nразмер ${q.m.size.toFixed(2)} свет ${q.m.light | 0} резк ${q.m.sharp | 0}` + (m ? `\nd=${m.d.toFixed(3)} второй=${m.second.toFixed(3)}` : "");
}
function grab(src) { // миниатюра для отметки, зеркально (как на экране)
  const c = document.createElement("canvas"); c.width = 320; c.height = Math.round(320 * src.height / src.width);
  const g = c.getContext("2d"); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.65);
}
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
$("cancelScan").onclick = () => { stopCam(); home(); };

// ---------- подтверждение ----------
let timer = null, pending = null;
const recent = new Map(); // id → {t, ts, kind}: защита от двойной отметки
function ask(id, score, photo) {
  const emp = data.employees.find(e => e.id === id);
  const evs = data.today.filter(e => e.e === id);
  const last = evs[evs.length - 1];
  const rc = recent.get(id);
  if (rc && Date.now() - rc.t < AGAIN_MS) { // только что отметился — повторно не пишем
    fin(true, emp.name, `${rc.kind === "in" ? "Пришёл" : "Ушёл"} ${hm(rc.ts)}`, "Уже отмечено — повторно не нужно", rc.kind); return;
  }
  const sug = last?.k === "in" ? "out" : "in";
  pending = { id, score, photo, name: emp.name };
  show("scan", false); show("confirm");
  $("snap").src = photo; $("whoName").textContent = emp.name;
  $("whoHint").textContent = last ? `${last.k === "in" ? "Приход" : "Уход"} сегодня в ${hm(last.t)}` : "Сегодня ещё не отмечался";
  document.querySelectorAll(".kind").forEach(b => {
    b.classList.toggle("on", b.dataset.k === sug);
    const bar = b.querySelector(".bar"); bar.style.transition = "none"; bar.style.width = "0";
    if (b.dataset.k === sug) requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${CONFIRM_MS}ms linear`; bar.style.width = "100%"; }));
  });
  clearTimeout(timer); timer = setTimeout(() => mark(sug), CONFIRM_MS);
}
document.querySelectorAll(".kind").forEach(b => b.onclick = () => mark(b.dataset.k));
$("notMe").onclick = () => { clearTimeout(timer); pending = null; home(); };

async function mark(kind) {
  clearTimeout(timer);
  if (!pending) return;
  const p = pending; pending = null;
  const c = geoLast && Date.now() - geoLast.t < 30 * 60000 ? geoLast.c : null; // геолокацию не ждём
  const now = new Date().toISOString();
  const args = { p_code: code, p_emp: p.id, p_kind: kind, p_score: +p.score.toFixed(3), p_photo: p.photo,
    p_lat: c?.latitude ?? null, p_lng: c?.longitude ?? null, p_acc: c?.accuracy ?? null, p_device: navigator.userAgent };
  let ts = now, offline = false;
  // Запись не обрываем по таймауту: запрос мог дойти, а ответ опоздать — повтор дал бы дубль.
  const slow = setTimeout(() => { $("whoHint").textContent = "Связь медленная, ждём ответа…"; }, SLOW_MS);
  try { const r = await rpc("att_kiosk_mark", args, WAIT_MS); ts = r.ts; sentMark(p.id, kind); }
  catch (e) {
    if (e.server) { fin(false, p.name, "Не записано", e.message); return; }
    // В очередь — только если запрос не ушёл (нет сети / ошибка сети до ответа). Обрыв по WAIT_MS — «возможно ушёл»: перед повтором сверимся с журналом.
    const q = jget("att_queue", []); q.push({ args: SUPPORTS_P_AT ? { ...args, p_at: now } : args, at: now, maybe: e.name === "AbortError" });
    localStorage.setItem("att_queue", JSON.stringify(q)); showQueue(); offline = true;
  } finally { clearTimeout(slow); }
  recent.set(p.id, { t: Date.now(), ts, kind });
  data.today.push({ e: p.id, k: kind, t: ts }); renderToday();
  const late = kind === "in" ? lateMin(ts) : 0;
  fin(true, p.name, `${kind === "in" ? "Пришёл" : "Ушёл"} ${hm(ts)}`,
    offline ? "Нет связи — отметка сохранена и отправится сама" : kind === "in" ? (late ? `Опоздание ${late} мин` : "Хорошего дня!") : "До завтра!", kind);
}

function fin(ok, name, title, sub, kind) {
  show("confirm", false); show("scan", false); show("result");
  $("doneIcon").textContent = ok ? "✓" : "!"; $("doneIcon").className = "done" + (kind === "out" ? " out" : "");
  $("doneIcon").style.color = ok ? "" : "var(--bad)";
  $("doneName").textContent = name; $("doneTitle").textContent = title; $("doneTitle").className = "kindbig" + (ok ? (kind === "out" ? " out" : "") : " bad");
  $("doneSub").textContent = sub;
  if (!ok) { beep("bad"); buzz([80, 60, 80]); }
  setTimeout(home, 3000);
}
function home() { busy = false; ["scan", "confirm", "result"].forEach(i => show(i, false)); show("idle"); }

// ---------- офлайн-очередь ----------
function showQueue() {
  const n = jget("att_queue", []).length;
  $("queue").textContent = n ? `Нет связи: ${n} отметок ждут отправки` : ""; show("queue", n > 0);
}
let flushing = false;
// ушедшие отметки (emp|kind → время ухода): тот же человек и вид повторно из очереди не шлём
const sentMark = (emp, kind) => { const m = jget("att_sent", {}); m[emp + "|" + kind] = Date.now(); for (const k in m) if (Date.now() - m[k] > 24 * 3600e3) delete m[k]; localStorage.setItem("att_sent", JSON.stringify(m)); };
async function flushQueue() {
  if (flushing) return; const q = jget("att_queue", []); if (!q.length) return;
  flushing = true;
  try {
    let fresh = null; try { fresh = await rpc("att_kiosk_load", { p_code: code }, 15000); } catch {} // журнал дня — не дошла ли отметка
    const rest = [], sent = jget("att_sent", {});
    for (const it of q) {
      const emp = it.args.p_emp, kind = it.args.p_kind, at = new Date(it.at).getTime();
      const inLog = fresh?.today?.some(e => e.e === emp && e.k === kind && new Date(e.t).getTime() >= at - 60000);
      if (inLog || (sent[emp + "|" + kind] ?? 0) >= at) continue; // уже записана — выбрасываем
      if (it.maybe && !fresh) { rest.push(it); continue; } // не знаем, дошла ли — без журнала не повторяем
      try { await rpc("att_kiosk_mark", it.args, WAIT_MS); sentMark(emp, kind); }
      catch (e) { if (!e.server) rest.push({ ...it, maybe: it.maybe || e.name === "AbortError" }); }
    }
    // за время отправки могли добавиться новые — берём их из хранилища
    const cur = jget("att_queue", []).filter(x => !q.some(y => y.at === x.at && y.args.p_emp === x.args.p_emp));
    localStorage.setItem("att_queue", JSON.stringify([...rest, ...cur])); showQueue();
  } finally { flushing = false; }
}
setInterval(flushQueue, 30000); addEventListener("online", flushQueue); showQueue();

$("go").onclick = () => { if (ready) scan(); else { show("ldErr", false); show("ld"); $("go").disabled = true; $("go").textContent = "Загрузка…"; loadModels(); } };
document.addEventListener("keydown", e => { if ((e.code === "Space" || e.key === "Enter") && !$("idle").classList.contains("hide") && !$("app").classList.contains("hide")) { e.preventDefault(); scan(); } });
loadModels();
start();
</script>
